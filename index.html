<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To Do: Lists</title>
</head>
<body class="container">
    <header>
        <h1 id="title">To Do: Lists</h1>
    </header>
    <main>
        <div>
            <input id="new-task" class="input" placeholder="Add a new task" aria-label="New task">
            <button class="button" aria-label="Add task">Add Task</button>
        </div>    
        <ul id="task-list"></ul>
    </main>
    <footer class="footer">
        <p>&copy; 2024 To Do List App</p>
    </footer>
    <script src="script.js" defer></script>
</body>
</html>
